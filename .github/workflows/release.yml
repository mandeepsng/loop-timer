name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: ${{ env.LOCALAPPDATA }}\electron\Cache
          key: electron-win-${{ hashFiles('package.json') }}

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-modules-win
        with:
          path: node_modules
          key: node-modules-win-${{ hashFiles('package.json') }}

      - name: Install dependencies
        if: steps.cache-modules-win.outputs.cache-hit != 'true'
        run: npm install --ignore-scripts

      - name: Build & Publish Windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder build --win --publish always

  release-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-linux-${{ hashFiles('package.json') }}

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-modules-linux
        with:
          path: node_modules
          key: node-modules-linux-${{ hashFiles('package.json') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-0 libnotify4 libnss3 libxss1 \
            libxtst6 libatspi2.0-0 libsecret-1-0 \
            fakeroot rpm

      - name: Install dependencies
        if: steps.cache-modules-linux.outputs.cache-hit != 'true'
        run: npm install --ignore-scripts

      - name: Build & Publish Linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder build --linux --publish always
