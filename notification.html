<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      cursor: pointer;
      user-select: none;
      overflow: hidden;
    }

    .emoji {
      font-size: 80px;
      margin-bottom: 32px;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.12); }
    }

    .title {
      color: #ffffff;
      font-size: 52px;
      font-weight: 700;
      margin-bottom: 20px;
      text-align: center;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      max-width: 80vw;
      word-break: break-word;
    }

    .message {
      color: rgba(255, 255, 255, 0.82);
      font-size: 30px;
      font-weight: 400;
      text-align: center;
      max-width: 70vw;
      line-height: 1.5;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
      word-break: break-word;
    }

    .hint {
      position: fixed;
      bottom: 56px;
      color: rgba(255, 255, 255, 0.35);
      font-size: 15px;
      letter-spacing: 0.5px;
    }

    .progress-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      height: 5px;
      background: rgba(255, 255, 255, 0.65);
      width: 100%;
      transform-origin: left center;
      animation: shrink linear forwards;
    }

    @keyframes shrink {
      from { transform: scaleX(1); }
      to   { transform: scaleX(0); }
    }
  </style>
</head>
<body>
  <div class="emoji">😎</div>
  <div class="title"  id="title">Time for a Break!</div>
  <div class="message" id="message">Take a break and relax!</div>
  <div class="hint">Click anywhere or press ESC to dismiss</div>
  <div class="progress-bar" id="progress"></div>

  <script>
    const { ipcRenderer } = require('electron');

    const params  = new URLSearchParams(window.location.search);
    const title   = params.get('title');
    const message = params.get('message');

    if (title)   document.getElementById('title').textContent   = title;
    if (message) document.getElementById('message').textContent = message;

    const DURATION = 7000;
    document.getElementById('progress').style.animation =
      `shrink ${DURATION / 1000}s linear forwards`;

    try {
      const ctx = new AudioContext();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.value = 520;
      gain.gain.setValueAtTime(0.25, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.8);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 1.8);
    } catch (e) {}

    function dismiss() {
      ipcRenderer.send('close-notification');
    }

    document.addEventListener('click', dismiss);
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ') dismiss();
    });

    setTimeout(dismiss, DURATION);
  </script>
</body>
</html>
