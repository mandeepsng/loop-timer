            .nav-pills-custom .nav-link {

            /* Add indicator arrow for the active tab */
            @media (min-width: 992px) {
                .nav-pills-custom .nav-link::before {
                    content: '';
                    display: block;

            /*
            *
            * ==========================================
            * FOR DEMO PURPOSE
            * ==========================================
            */
            body {
                min-height: 100vh;
                background: linear-gradient(to left, #dce35b, #45b649);
            }


            @import url("https://fonts.googleapis.com/css?family=Ubuntu:300|Open+Sans");

            :root {
                --font-timer: "Ubuntu", sans-serif;
                --font-body: "Open Sans", sans-serif;
                --color-highlight: #f5f4f4;
                --color-text: #1f1c1c;
                --color-bg: #c7c5c5;
                --color-bg-l: #ebebeb;
                --color-app: #fff;
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            /* body {
                width: 100%;
                min-height: 100vh;
                font-family: var(--font-body);
                color: var(--color-text);
                background: linear-gradient(to top right, var(--color-bg), var(--color-bg-l));
            } */
            /* horizontally center the wrapping container and notably reduce its width, to emulate a mobile device */
            .app {
                max-width: 250px;
                margin: 1rem auto;
                padding: 0.5rem;
                border-radius: 20px;
                background: var(--color-app);
                box-shadow: 0 0 15px -5px var(--color-bg), -4px 2px 10px var(--color-bg);
            }

            /* for the timer, add plenty of whitespace atop and below the headings */
            .app__timer {
                padding: 5rem 1rem;
                text-align: center;
                font-family: var(--font-timer);
                line-height: 2;
                background: var(--color-app);
                /* position relative to absolute position the pseudo element */
                position: relative;
            }
            /* through a pseudo element add a ring around the headings */
            .app__timer:before {
                position: absolute;
                content: "";
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                width: 75%;
                height: 75%;
                border: 1px solid var(--color-bg-l);
                border-radius: 50%;
                transition: border 0.2s ease-out;
            }
            /* with a class of active, show the ring with more intensity */
            .app__timer.active:before {
                border: 1px solid var(--color-bg);
            }

            /* reduce the importance of the h3 element in comparison to the main h1 heading */
            .app__timer h1 {
                font-size: 1.8rem;
                font-weight: 300;
            }
            .app__timer h3 {
                font-size: 1rem;
                font-weight: 300;
            }

            /* for the options, display them in a single column, atop one another
            cap the height to allow for vertical scroll
            ! remember to set flex-shrink to 0 for the flex items
            */
            .app__options {
                padding: 0 1rem;
                display: flex;
                flex-direction: column;
                overflow-y: auto;
                height: 120px;
                /* the margin allows to show the scrollbar also within the boundaries of the main container */
                margin: 0.5rem;
            }

            /* minor stylistic choices regarding the scrollbar */
            .app__options::-webkit-scrollbar {
                width: 0.15rem;
            }
            .app__options::-webkit-scrollbar-track {
                box-shadow: inset 0 0 6px var(--color-bg-l);
            }
            .app__options::-webkit-scrollbar-thumb {
                background: var(--color-bg);
                border-radius: 5px;
            }

            /* for the input element and the buttons, add the same property value pairs to style them as rather straightforward strings of text */
            .app__options form input,
            .app__options button {
                flex-shrink: 0;
                text-align: left;
                background: none;
                border: none;
                font-family: inherit;
                color: inherit;
                padding: 1rem 0.5rem;
                border-bottom: 1px solid var(--color-bg-l);
                transition: all 0.2s ease-out;
            }
            /* on hover slightly show a colored background */
            .app__options form input:hover,
            .app__options button:hover {
                background: var(--color-highlight);
            }

            /* for the input individually, stretch its width to cover the entirety of the viewport and apply the same color of the text to the placeholder as well */
            .app__options form input {
                width: 100%;
            }
            .app__options form input::placeholder {
                color: inherit;
            }

            .design-box {
                flex-direction: column;
                align-items: center;
            }
            
            .design-box #v-pills-tab {
                display: flex;
                flex-direction: row-reverse !important;
                justify-content: space-between;
                position: relative;
            }
            
            .design-box #v-pills-tab a {
                flex: 0 48%;
            }
            
            .design-box #v-pills-tab a:before {
                transform: rotate(90deg);
                left: auto;
                bottom: -13px !important;
                top: auto;
                right: 122px;
            }

    <script type="text/javascript">

        // intervalID to ensure only one interval runs at a tim
        let intervalID = 0;
        let intervalIds = [];

        // function zero-padding the integer passed as argument
        const zeroPad = num => (num < 10 ? `0${num}` : num);


        // function showing the countdown in the selected element
        // accepting a number of seconds and displaying the number of minutes and seconds
        function showTimer(seconds) {
        // target the container in which to show the countdown and apply a class to slightly update the visual
        const appTimer = document.querySelector('.app__timer');
        appTimer.classList.add('active');

        // compute the number of minutes and of seconds
        const minutes = Math.floor(seconds / 60);
        // using the modulo operator to consider the remainder past the 60s marker
        const remainingSeconds = seconds % 60;

        // add the information in the main heading
        appTimer.querySelector('h1').textContent = `${zeroPad(minutes)}:${zeroPad(remainingSeconds)}`;
        }


        // function creating the timer
        // accepting as argument a number of seconds, setting up an interval to update the UI every second as to show the passage of time
        function timerddd(seconds) {
            // immediately clear any, if existing, intervals
            clearInterval(intervalID);

            console.log(`window.intervalIds = > ${window.intervalIds}`)

            // create two dates instances, one for the moment in which the timer begins, one for the moment in which it should end
            const now = Date.now();
            const then = new Date(now + seconds * 1000);

            // compute the number of seconds between the two SVGElementInstanceList, and immediately call the function to highlight the amount of time
            const totalSeconds = Math.round((then - now) / 1000);
            // immediately show the timer for the number of seconds
            showTimer(totalSeconds);

            console.log(`seconds = ${seconds}`)


            // change the text of the sub-heading to show the time at which the timer will end
            const appTimer = document.querySelector('.app__timer');
            // based on the number of hours and minutes of the `then` instance
            // appTimer.querySelector('h3').textContent = `Back @ ${then.getHours()}:${zeroPad(then.getMinutes())}`;

            // set up the interval
            intervalID = setInterval(() => {
                // compute the number of seconds between the current instance and the instance represented by `then`
                    const missingSeconds = Math.round((then - Date.now()) / 1000);

                    console.log(missingSeconds + " seconds")
                    console.log(then + " then")


                    ipcRenderer.send('saveTime', { missingSeconds : missingSeconds, totalSeconds: totalSeconds , intervalID: intervalID  } );
                    ipcRenderer.send('saveInterval', { intervalIIId: intervalID  } );

                    showTimer(missingSeconds);

                // when reaching 0 clear the interval and remove the arbitrary class
                if (missingSeconds <= -1) {

                    ipcRenderer.send('notification', { loopInteval : intervalIds   } );

                    appTimer.classList.remove('active');

                    console.log(`missingSeconds = ${missingSeconds}`)
                    console.log(`intervalID => ${intervalID}`)
                    
                    //clearInterval(intervalID);

                    intervalIds.push(intervalID);

                    window.intervalIds = intervalIds;

                    if (intervalIds && intervalIds.length > 0) {
                        console.log('Clearing existing intervals');
                        intervalIds.forEach((intervalId) => {
                            clearInterval(intervalId);
                        });
                        intervalIds = []; // Clear the array
                    }
                    
                    console.log(`totalSeconds = ${totalSeconds}`)
                    timer(seconds)

                }
            }, 1000);


            
        }


        


        // target the buttons which allow to run a timer for a prescribed amount of time
        const buttons = document.querySelectorAll('button');

        // function called in response to a click event on one of the buttons
        function handleClick() {
            // retrieve the number of seconds described in the data.time attribute
            // ! use the parse function to store a reference to the value as an integer
            const seconds = parseInt(this.getAttribute('data-time'), 10);
            // start the timer for the selected number of seconds
            //timer(seconds);
            var classTime = seconds;
           // ipcRenderer.send('notification', { classTime });

        }
        // attach an event listener on each button for a click event
        buttons.forEach(button => button.addEventListener('click', handleClick));


        // target the form detailing an integer for a selected number of minutes
        // ! it is possible to call an element by name through `document.name`
        const form = document.customTimer;

        // function called in response to the submit event being fired on the form
        function handleSubmit(e) {
            // prevent the default behavior
            e.preventDefault();

           //  ipcRenderer.send('saveTime', { classTime });
            // retrieve the value detailed in the input element
            /* minutes is the name of the input element, which means that
                this.minutes.value
                targets the same element as
                this.querySelector('input[name="minutes"])
            */
            const minutes = parseInt(this.minutes.value, 10);
            // start the timer for the selected number of minutes
            timer(minutes * 60);

            // clear the form of any value
            this.reset();
        }

        // listen for the submit event on the entire form
        form.addEventListener('submit', handleSubmit);

        

    </script>
